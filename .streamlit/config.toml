# Light and dark palettes: users switch with the app menu (top right) -> Settings -> theme.
[theme]
font = "sans serif"

[theme.light]
primaryColor = "#3b5bdb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f5f7"
textColor = "#1f2328"

[theme.dark]
primaryColor = "#7b93ff"
backgroundColor = "#111318"
secondaryBackgroundColor = "#1b1e25"
textColor = "#e6e8eb"
