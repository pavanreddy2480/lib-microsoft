[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lms"
version = "0.1.0"
description = "Library Management System prototype (IIIT Hackathon) - Streamlit + SQLite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.30"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lms = ["persistence/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
